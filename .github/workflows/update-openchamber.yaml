name: "Update OpenChamber"

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: write

concurrency:
  group: update-openchamber
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27

      - name: Update OpenChamber
        run: nix run nixpkgs#nix-update -- --flake --build --generate-lockfile openchamber

      - name: Commit and push if updated
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "OpenChamber is already up to date."
            exit 0
          fi

          version="$(nix eval --raw .#openchamber.version)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update openchamber to ${version}"
          git push origin HEAD:main
