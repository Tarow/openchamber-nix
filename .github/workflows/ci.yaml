name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27

      - name: Build OpenChamber
        run: nix build .#openchamber

      - name: Build OpenChamber Desktop
        run: nix build .#openchamber-desktop
